name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          NODE_OPTIONS: --require ./scripts/block-outbound.cjs
      - run: npm run build
      - run: git diff --check
  launchers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build-release.py
      - run: python scripts/check-launchers.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Exercise the complete invented demo
        shell: bash
        run: |
          GOLF_DEMO_DATA_DIR="$RUNNER_TEMP/golf-demo" PORT=5088 NODE_OPTIONS='--require ./scripts/block-outbound.cjs' node scripts/serve.mjs --demo > "$RUNNER_TEMP/golf-server.log" 2>&1 &
          server=$!
          trap 'kill -TERM "$server" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5088/api/runtime >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser-tournament.mjs
          node tests/browser-proposals.mjs
          if grep -q GOLF_TEST_OUTBOUND_DENIED "$RUNNER_TEMP/golf-server.log"; then cat "$RUNNER_TEMP/golf-server.log"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
  redis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: node --test tests/redis.integration.test.mjs
        env:
          REDIS_SERVER: /usr/bin/redis-server
          REDIS_CLI: /usr/bin/redis-cli
          NODE_OPTIONS: --require ./scripts/block-outbound.cjs
